name: Build VSIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX package
        run: npm run build:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-project-toolkit-vsix
          path: "*.vsix"
          if-no-files-found: error
